[build]
builder = "NIXPACKS"
# Nixpacks already runs `npm ci` in its install phase — do not repeat it here
# or npm hits EBUSY on node_modules/.cache.

[deploy]
startCommand = "npm start"
healthcheckPath = "/api/health"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
